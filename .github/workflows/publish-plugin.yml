name: Publish Codex plugin

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-codex-plugin

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: qinbatista/qin-codex-skills/.github/actions/publish-plugin@master
        with:
          plugin: qin-unity-skills
